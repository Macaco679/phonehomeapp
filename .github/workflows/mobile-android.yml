name: Android (Play Store)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão exibida (ex.: 1.0.0)"
        default: "1.0.0"
  push:
    paths:
      - "phonehome-app/mobile/**"
      - ".github/workflows/mobile-android.yml"

defaults:
  run:
    working-directory: phonehome-app/mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar projeto Android (ícones, abertura, versão)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: npm run android:add

      - name: Compilar (APK de teste + AAB da loja)
        working-directory: phonehome-app/mobile/android
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Assinar AAB com a chave de envio
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
            jarsigner -verify "$AAB" | head -3
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredos da chave Android não configurados: o AAB sai SEM assinatura e a Play Store vai recusar."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: phonehome-android-apk-teste
          path: phonehome-app/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phonehome-android-aab-loja-assinado-${{ steps.sign.outputs.signed }}
          path: phonehome-app/mobile/android/app/build/outputs/bundle/release/app-release.aab
