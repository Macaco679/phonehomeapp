<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phone Home</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:-apple-system,system-ui,sans-serif;background:#2563eb;color:#fff;text-align:center;padding:24px}
  button{background:#fff;color:#2563eb;border:0;border-radius:14px;padding:14px 28px;font-size:16px;font-weight:600}
</style>
</head>
<body>
  <h1 style="margin:0;font-size:28px">Phone Home</h1>
  <p id="m" style="margin:0;opacity:.9">Conectando…</p>
  <button onclick="go()">Tentar novamente</button>
<script>
  var URL_APP = 'https://phonehome-app.vercel.app';
  function go(){ location.replace(URL_APP); }
  setTimeout(function(){ document.getElementById('m').textContent='Sem conexão com a internet. Verifique e tente de novo.'; }, 4000);
  go();
</script>
</body>
</html>
